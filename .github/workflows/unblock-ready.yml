# repo-baseline canon — unblock-ready.yml
# When an issue closes, promote each dependent whose last open blocker it was
# to status:ready (native blocked_by edges never flip the label themselves).
# Issues with an open needs-* label are skipped, and re-evaluated when it is removed.
# Logic + label rules: .github/scripts/unblock_ready.py
name: Unblock Ready

on:
  issues:
    types: [closed, unlabeled]

permissions:
  contents: read
  issues: write

jobs:
  promote:
    # Every unlabel fires the event; only a needs-* removal is ours.
    if: github.event.action == 'closed' || startsWith(github.event.label.name, 'needs-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Promote unblocked issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: python3 .github/scripts/unblock_ready.py
