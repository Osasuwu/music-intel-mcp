# repo-baseline canon — unblock-ready.yml
# Keeps status:* labels in step with the issue and PR lifecycle:
# - issue closed: strip status:* (except status:hardware-*), then promote each
#   dependent whose last open blocker it was to status:ready;
# - issue reopened: drop stale in-progress/review, restore ready if nothing holds it;
# - needs-* removed: re-evaluate an issue that was skipped for it;
# - PR opened / ready for review: issues it closes move to status:review;
# - PR closed unmerged: those issues go back to ready;
# - manual dispatch: one-off sweep of status:* on closed issues.
# Label writes use GITHUB_TOKEN, so they trigger no other workflows.
# Logic + label rules: .github/scripts/unblock_ready.py
name: Unblock Ready

on:
  issues:
    types: [closed, reopened, unlabeled]
  pull_request:
    types: [opened, reopened, ready_for_review, edited, closed]
  workflow_dispatch:

# Serialises repeats on one event source (a PR edited then closed, an issue
# closed then reopened) and nothing wider: a PR event writes labels on the
# issues it closes, whose numbers are only known after the GraphQL lookup, so
# no expression can key a PR run to the same group as those issues' own events.
# Going repo-wide instead would be worse than the race: with one group for
# every event GitHub cancels the previously pending run whenever a third
# arrives, silently dropping that issue's label update.
# What keeps the unkeyable race harmless is that every write is idempotent —
# adding a label already present is a no-op and `_remove_label` treats a 404 as
# the intended end state — so interleaved runs converge instead of crashing.
# Queue, never cancel: a cancelled run leaves the labels half-written.
concurrency:
  group: >-
    unblock-ready-${{ github.event.issue.number
    || github.event.pull_request.number
    || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  promote:
    # Every unlabel fires the event; only a needs-* removal is ours. Drafts
    # aren't up for review yet, a merge closes the issue itself, and a fork's
    # read-only token can't write labels.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues'
          && (github.event.action != 'unlabeled' || startsWith(github.event.label.name, 'needs-')))
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action == 'closed'
              && !github.event.pull_request.merged
              || github.event.action != 'closed' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Sync issue status labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: python3 .github/scripts/unblock_ready.py
