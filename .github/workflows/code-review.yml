name: Code Review

# Produces review EVIDENCE only; it never decides anything. The `verify-verdict`
# check is posted by code-gate-verdict.yml (base-pinned, run from the default
# branch) from the `review-evidence` artifact uploaded here. Rule: "Review
# evidence" — docs/reference/github-repo-setup.md §3.
#
# This job's workspace is the BASE branch, never the PR head: the reviewer is an
# LLM reading attacker-controllable text, so nothing the PR carries may become
# executable or config-recognized on disk. The PR's content is fetched through
# the API into `.pr-head/` with every file suffixed `.pr`.

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Code review PR #{0} @ {1}', inputs.pr_number, inputs.head_sha)
  || format('Code review PR #{0} @ {1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Maintainer-run review of an untrusted (fork / Dependabot) PR: pr_number AND
  # head_sha are both required so the evidence is bound to exactly the commit
  # the maintainer looked at. Must be dispatched on the default branch.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      head_sha:
        description: Full 40-char head SHA of that PR to review
        required: true
        type: string

# A newer push (or a dispatch) for the same PR supersedes the review in flight.
concurrency:
  group: code-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # `edited` fires on every title/body edit; only a base-branch change alters
    # what is under review, so any other edit proceeds no further.
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base
    # The dispatch path (untrusted PRs) runs inside the `untrusted-review`
    # environment so its secrets and required reviewers are scoped separately.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'untrusted-review' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      # PR-controlled values reach steps through env only, never a `run:` body.
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
      EVENT_NAME: ${{ github.event_name }}
      FINDINGS: .review/findings.json

    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be digits"; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha must be a full 40-char lowercase SHA"; exit 1; }
          [ "$REF_NAME" = "$DEFAULT_BRANCH" ] || { echo "::error::dispatch the review on $DEFAULT_BRANCH, not $REF_NAME"; exit 1; }

      # BASE, never head or the merge ref. For a dispatch, the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}

      # Snapshot the PR through the API: decide skip/review (draft, all-cosmetic,
      # untrusted author on a pull_request run, incomplete file list) and, when
      # reviewing, stage the head content under .pr-head/. Aborts if the PR head
      # is no longer the SHA this run was started for.
      - name: Prepare review inputs
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' '.pr-head/' >> .git/info/exclude
          python .github/scripts/code_gate_verdict.py prepare --head-dir .pr-head

      - name: Record skipped review
        if: steps.prepare.outputs.skip_reason != ''
        env:
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          BASE_REF: ${{ steps.prepare.outputs.base_ref }}
          SKIP_REASON: ${{ steps.prepare.outputs.skip_reason }}
        run: python .github/scripts/code_gate_verdict.py skip --reason "$SKIP_REASON" --out review-evidence.json

      # The placeholder is not valid findings, so a reviewer that never records a
      # result leaves a file that fails validation rather than an empty "clean".
      - name: Seed findings file
        if: steps.prepare.outputs.skip_reason == ''
        run: |
          mkdir -p .review
          printf '%s\n' '{"status":"unreviewed"}' > "$FINDINGS"

      - name: Run code review
        id: review
        if: steps.prepare.outputs.skip_reason == ''
        # A reviewer error is not itself a verdict: what decides is whether a
        # valid findings file exists afterwards (validate step below).
        continue-on-error: true
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          plugin_marketplaces: ./.claude/marketplace
          plugins: code-review@jarvis-fork-plugins
          prompt: |
            Run /code-review for PR #${{ env.PR_NUMBER }} in repo ${{ github.repository }}.

            The /code-review slash command is provided by the code-review plugin
            (loaded via the action's plugins input). Follow its instructions
            verbatim — eligibility check, guideline-file gather, 12 parallel
            reviewers, confidence scoring, post comment.

            Do NOT load Jarvis SOUL.md, do NOT call memory_recall/memory_store
            (not available in this runner). This is plugin invocation only.
          claude_args: |
            --allowed-tools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh label list:*),Bash(git show:*),Bash(git blame:*),Bash(git log:*),Bash(git diff:*),Bash(git ls-tree:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(nl:*),Bash(tr:*),Bash(echo:*),Bash(python -m py_compile:*),Bash(python3 -m py_compile:*),Bash(bash -n:*),Bash(node --check:*),Write,Skill(code-review:code-review)"

      - name: Upload review execution log
        if: always() && steps.review.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claude-execution-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: warn

      # Nothing but the findings file may differ from the base checkout.
      - name: Check workspace is clean
        if: steps.prepare.outputs.skip_reason == ''
        run: python .github/scripts/code_gate_verdict.py check-tree --findings "$FINDINGS"

      - name: Validate findings
        if: steps.prepare.outputs.skip_reason == ''
        run: python .github/scripts/code_gate_verdict.py validate --findings "$FINDINGS"

      - name: Stamp review evidence
        if: steps.prepare.outputs.skip_reason == ''
        env:
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          BASE_REF: ${{ steps.prepare.outputs.base_ref }}
        run: python .github/scripts/code_gate_verdict.py stamp --findings "$FINDINGS" --out review-evidence.json

      # 90 days: the verdict re-reads this on every later event for the SHA; an
      # expired artifact turns the gate red ("re-dispatch the review").
      - name: Upload review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-evidence
          path: review-evidence.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
